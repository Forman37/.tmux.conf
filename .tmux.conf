# ============================================================
# Beginner tmux config (~/.tmux.conf)
# ============================================================

# ----- General -----------------------------------------------

# Increase scrollback history
set -g history-limit 10000

# Start window and pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce escape-key delay (important for Vim/Neovim users)
set -sg escape-time 10

# Enable mouse support (click to select pane/window, scroll, resize)
set -g mouse on

# Use 256-color + true-color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase display time for pane indicators and status messages
set -g display-panes-time 2000
set -g display-time 2000

# ----- Prefix key --------------------------------------------
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
# Comment these two lines out if you prefer to keep Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix   # Press Ctrl-a twice to send literal Ctrl-a

# ----- Key bindings ------------------------------------------

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (much more intuitive than " and %)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with Vim-style keys (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + arrow keys (hold prefix, tap arrow)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Copy mode (vi keys) -----------------------------------
setw -g mode-keys vi

bind Enter copy-mode                       # Enter copy mode with prefix + Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ----- Status bar --------------------------------------------

# Refresh interval (seconds)
set -g status-interval 5

# Position the status bar at the bottom
set -g status-position bottom

# Status bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "

# Right: date and time
set -g status-right-length 50
set -g status-right "#[fg=#a6e3a1] %Y-%m-%d  %H:%M "

# Window tabs
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "

# Pane border colors
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# ============================================================
# Quick reference (prefix = Ctrl-a by default in this config)
# ============================================================
# prefix + |        Split pane vertically
# prefix + -        Split pane horizontally
# prefix + h/j/k/l  Move between panes
# prefix + H/J/K/L  Resize pane
# prefix + c        New window
# prefix + n/p      Next/previous window
# prefix + 1-9      Jump to window by number
# prefix + ,        Rename window
# prefix + $        Rename session
# prefix + d        Detach from session
# prefix + [        Enter scroll/copy mode (q to quit)
# prefix + Enter    Enter copy mode
# prefix + r        Reload this config
# ============================================================
